{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto card p-8 mt-10">
  <h1 class="text-xl font-semibold mb-1">Create your account</h1>
  <p class="text-stone-800 text-sm mb-6">First account = owner of this instance.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-full">Sign up</button>
  </form>
  <p class="text-sm text-stone-800 mt-4">Have an account? <a class="link" href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
