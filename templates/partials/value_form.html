<tr id="holding-{{ holding.pk }}" class="bg-amber-50/60 hover:bg-amber-50/60">
  <td colspan="9">
    <form hx-post="{% url 'update_value' holding.pk %}" hx-target="#holding-{{ holding.pk }}" hx-swap="outerHTML"
          class="flex flex-wrap items-center gap-3">
      {% csrf_token %}
      <label for="id_current_value_{{ holding.pk }}" class="text-sm text-stone-900 whitespace-nowrap">
        Current value of <span class="font-semibold">{% include "partials/asset_link.html" with asset=holding.asset only %}</span> (₹)…
      </label>
      <input id="id_current_value_{{ holding.pk }}" name="current_value" type="number" step="0.01" inputmode="decimal"
             value="{{ holding.current_value|default_if_none:'' }}" autocomplete="off"
             class="field w-40">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <button type="button" hx-get="{% url 'update_value' holding.pk %}?cancel=1" hx-target="#holding-{{ holding.pk }}" hx-swap="outerHTML"
              class="btn btn-secondary btn-sm">Cancel</button>
    </form>
  </td>
</tr>
