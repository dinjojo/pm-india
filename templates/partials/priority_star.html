        aria-label="{% if priority %}Remove priority{% else %}Mark as priority{% endif %}" aria-pressed="{% if priority %}true{% else %}false{% endif %}"
        class="cursor-pointer text-lg leading-none {% if priority %}text-amber-500 hover:text-amber-600{% else %}text-stone-300 hover:text-amber-500{% endif %} focus-visible:outline-2 focus-visible:outline-emerald-600 rounded">★</button>
